<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收集小径 — software rasterizer 演示游戏</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #14161a; color: #cfd6e0;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; color: #e8edf4; }
  h1 small { color: #7d8794; font-weight: 400; margin-left: 8px; }
  a { color: #6ea8dc; font-size: 13px; }
  #frame { position: relative; }
  canvas {
    display: block; width: 512px; height: 512px;
    border: 1px solid #2a2f37; border-radius: 6px;
    image-rendering: pixelated; touch-action: none;
  }
  #hud {
    position: absolute; left: 10px; top: 10px; display: flex; gap: 10px;
    font: 12px/1.4 ui-monospace, Consolas, monospace;
    background: rgba(10, 12, 16, 0.72); border: 1px solid #2a2f37;
    border-radius: 4px; padding: 4px 8px; pointer-events: none;
  }
  #fps { color: #7fd08a; min-width: 72px; }
  #score {
    position: absolute; right: 10px; top: 10px;
    font: 15px/1.4 ui-monospace, Consolas, monospace; color: #e8edf4;
    background: rgba(10, 12, 16, 0.72); border: 1px solid #2a2f37;
    border-radius: 4px; padding: 5px 10px; pointer-events: none;
  }
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: rgba(10, 12, 16, 0.72); border-radius: 6px;
  }
  #overlay h2 { margin: 0; color: #7fd08a; font-size: 22px; }
  #hint { font: 12px/1.4 ui-monospace, Consolas, monospace; color: #8b95a3; }
  button {
    background: #2c4a6e; color: #fff; border: 0; border-radius: 4px; padding: 8px 18px;
    font: 14px/1.4 "Segoe UI", sans-serif; cursor: pointer;
  }
  button:hover { background: #38608f; }
</style>
</head>
<body>
  <h1>收集小径<small>纯 CPU 软件光栅器 · 第三人称演示游戏</small></h1>
  <div><a href="./index.html">← demo</a> · <a href="./editor.html">关卡编辑器 →</a></div>
  <div id="frame">
    <canvas id="view" width="512" height="512"></canvas>
    <div id="hud"><span id="fps">--.- fps</span><span id="res">--</span></div>
    <div id="score">得分 0 / 10</div>
    <div id="overlay">
      <h2>收集完成!</h2>
      <div id="winTime"></div>
      <button id="restart">再来一局</button>
    </div>
  </div>
  <div id="hint">WASD / 方向键移动 · 收集全部 10 个光环</div>
  <script src="./js/demo/src/game.js" type="module"></script>
</body>
</html>
