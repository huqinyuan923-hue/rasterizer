<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>software rasterizer — 纯 CPU 软件光栅器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #14161a; color: #cfd6e0;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; color: #e8edf4; }
  h1 small { color: #7d8794; font-weight: 400; margin-left: 8px; }
  #frame { position: relative; }
  canvas {
    display: block; width: 512px; height: 512px;
    border: 1px solid #2a2f37; border-radius: 6px;
    image-rendering: pixelated; cursor: grab; touch-action: none;
  }
  canvas:active { cursor: grabbing; }
  #hud {
    position: absolute; left: 10px; top: 10px; display: flex; gap: 10px;
    font: 12px/1.4 ui-monospace, Consolas, monospace;
    background: rgba(10, 12, 16, 0.72); border: 1px solid #2a2f37;
    border-radius: 4px; padding: 4px 8px; pointer-events: none;
  }
  #fps { color: #7fd08a; min-width: 72px; }
  #hint { position: absolute; right: 10px; bottom: 10px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: #8b95a3; background: rgba(10,12,16,0.6); padding: 3px 8px; border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>
  <h1>software rasterizer<small>纯 TypeScript · 零依赖 · 逐像素对拍</small></h1>
  <div id="frame">
    <canvas id="view" width="512" height="512"></canvas>
    <div id="hud"><span id="fps">--.- fps</span><span id="ms">---.- ms</span><span>512×512</span></div>
    <div id="hint">拖拽旋转 · 滚轮缩放</div>
  </div>
  <script type="module" src="./js/demo/src/main.js"></script>
</body>
</html>
